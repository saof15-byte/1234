name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -version
      - name: Build
        run: |
          xcodebuild \
            -project UnifiedCalendar.xcodeproj \
            -scheme UnifiedCalendar \
            -destination 'platform=macOS' \
            -configuration Debug \
            build
      - name: Check the app bundle has an identifier
        run: |
          APP=$(find ~/Library/Developer/Xcode/DerivedData -name 'UnifiedCalendar.app' -type d | head -1)
          echo "App bundle: $APP"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Contents/Info.plist"
